<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .contenedor-campos {
        display: flex;
        /* Activa Flexbox */
        gap: 10px;
        /* Espacio entre campos */
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }
</style>

<body>
    <div class="contenedor-campos">
        <h3>Orden de Trabajo N° 123456789 Tipo : General</h3>
    </div>
    <table> <!-- El borde se estiliza mejor con CSS -->
        <tr>
            <th>Cliente: Sandra Perez</th>
            <th>Telefono: (123) 456-7890</th>

        </tr>
        <tr>
            <td>Localidad: Santiago</td>
            <td>CUIT: </td>

        </tr>
        <tr>
            <td>Laptop</td>
            <td>$1200</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>$25</td>
        </tr>
    </table>


</body>

</html>
